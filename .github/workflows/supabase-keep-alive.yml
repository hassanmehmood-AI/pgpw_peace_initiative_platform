name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 03:00 UTC, well within Supabase's 7-day inactivity window
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/forum_categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $status"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase ping failed with HTTP $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
